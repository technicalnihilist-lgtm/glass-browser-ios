<!DOCTYPE html>
<html lang="en" data-theme="light" data-private="0">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Browser</title>
<meta name="color-scheme" content="light dark">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--gr:255,255,255;--g2r:255,255,255;--g:rgba(var(--gr),calc(.26*var(--k)));--g2:rgba(var(--g2r),min(.94,calc(.28 + .22*var(--k))));--gb:rgba(255,255,255,.55);--t:#14161a;--s:#586070;--a:#0a7cff;--bg:linear-gradient(160deg,#8ec5ff,#c7a6ff 55%,#ffb7d5);--r:22px;--sp:cubic-bezier(.34,1.56,.64,1);--sh:0 10px 34px rgba(20,30,60,.18);--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}

button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;transition:transform calc(.35s*var(--ts)) var(--sp)}

[hidden]{display:none!important}

.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at calc(12% + var(--tx)*30%) calc(var(--ty)*25%),rgba(255,255,255,.5),transparent 42%);pointer-events:none}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 -12px 20px -12px rgba(255,255,255,.4)}
#sheet,#menu,#sug{background:var(--g2)}
:root{--tx:0;--ty:0;--k:1;--ts:1;--bn:1}

.tile i,.card{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 8px 20px rgba(10,20,50,.18),inset 2px 2px 1px -1px rgba(255,255,255,.75),inset -2px -2px 1px -1px rgba(255,255,255,.35)}

.card.out{transition:transform .18s,opacity .18s}
.cards.still .card{animation:none}
#results{height:100%;overflow:auto;padding:calc(var(--sa) + 84px) 18px calc(var(--sb) + 110px);max-width:760px;margin:auto;animation:swap calc(.55s*var(--ts)) var(--sp)}
#results h1{font-size:28px;letter-spacing:-.02em;margin:6px 4px 14px;overflow-wrap:anywhere}
#results h2{font-size:15px;margin:22px 4px 8px;color:var(--s);font-weight:600}
a.row{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto;pointer-events:none}
#lock{display:grid;place-items:center;color:var(--s)}#lock svg.i{width:20px;height:20px}
#tool svg.i{width:25px;height:25px}
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:54px;height:32px;border-radius:99px;position:relative;cursor:pointer;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(255,255,255,.12)),var(--gb);border:1px solid var(--gb);box-shadow:inset 0 2px 5px rgba(0,0,0,.18);transition:background calc(.35s*var(--ts)),box-shadow calc(.35s*var(--ts))}

input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--gb)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:linear-gradient(180deg,#fff,#e9edf5);border:0;box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 1px 1px #fff;transition:transform calc(.35s*var(--ts)) var(--sp)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.3)}
[data-motion=off] input::before{transition:none!important}
#pill{position:absolute;left:0;top:5px;bottom:5px;width:52px;border-radius:99px;pointer-events:none;opacity:0;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.18));box-shadow:inset 1px 1px 1px rgba(255,255,255,.8),inset -1px -1px 1px rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.18);transition:transform calc(.55s*var(--ts)) var(--sp),width calc(.45s*var(--ts)) var(--sp),opacity calc(.3s*var(--ts))}
#tool button{position:relative;z-index:1}
#tool{touch-action:none}
.field.sl{display:grid;grid-template-columns:1fr auto;gap:6px 10px}.field.sl input{grid-column:1/-1;width:100%;max-width:none;accent-color:var(--a);padding:0}.field.sl b{font-variant-numeric:tabular-nums;color:var(--s);font-weight:600}

#tool button:active{transform:scale(1.12)}
#view{position:fixed;inset:0}
#start{height:100%;overflow:auto;padding:calc(var(--sa) + 84px) 18px calc(var(--sb) + 110px);max-width:760px;margin:auto}

.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;text-align:left;width:100%}
.row .m{flex:1;min-width:0}.row b,.row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--s);font-size:12px}
.list{padding:4px}.empty{color:var(--s);padding:8px 6px;font-size:14px}
#web{position:absolute;inset:0;padding:calc(var(--sa) + 66px) 0 calc(var(--sb) + 82px)}
#frame{width:100%;height:100%;border:0;background:#fff}
#chip{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translateX(-50%);padding:6px 12px;font-size:13px;z-index:4;white-space:nowrap;border-radius:99px}
#blocked{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
#blocked .glass{padding:26px;max-width:380px}#blocked p{color:var(--s);margin:8px 0 16px;font-size:14px}
.btn{padding:10px 18px;border-radius:99px;background:var(--a);color:#fff;font-weight:600;display:inline-block}
.btn.q{background:var(--g);color:var(--t);border:1px solid var(--gb)}
#top{position:fixed;top:0;left:0;right:0;padding:calc(var(--sa) + 8px) 12px 0;z-index:6}
.bar{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 14px;border-radius:99px;max-width:720px;margin:auto;overflow:hidden;transition:transform calc(.45s*var(--ts)) var(--sp)}
.bar:focus-within{transform:scale(1.02)}
#addr{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;padding:9px 4px}
.bar button{width:34px;height:34px;border-radius:50%;color:var(--s)}
#prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--a);border-radius:3px;opacity:0}

#sug{max-width:700px;margin:8px auto 0;padding:6px;border-radius:20px}

#tool{position:fixed;left:50%;bottom:calc(var(--sb) + 12px);transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:99px;z-index:6;width:min(420px,calc(100% - 24px));justify-content:space-around;transition:transform calc(.5s*var(--ts)) var(--sp),opacity calc(.3s*var(--ts))}

#tool button{width:52px;height:46px;border-radius:99px;font-size:20px}
#tool button:disabled{opacity:.3}
#cnt{display:inline-block;min-width:24px;padding:1px 5px;border:2px solid currentColor;border-radius:7px;font:700 13px/1.3 inherit}

#menu button{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:14px}
#menu button:hover{background:var(--gb)}
#shade{position:fixed;inset:0;z-index:7;background:rgba(0,0,0,.25)}
#sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--sa) + 40px);z-index:9;border-radius:28px 28px 0 0;max-width:760px;margin:auto;display:flex;flex-direction:column;animation:up calc(.45s*var(--ts)) var(--sp)}
#sheet header{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}

#sheet .body{overflow:auto;padding:4px 14px calc(var(--sb) + 20px);flex:1}
.seg{display:flex;gap:4px;padding:4px;border-radius:99px;margin:4px 0 10px;background:var(--gb)}
.seg button{flex:1;padding:7px;border-radius:99px;font-size:14px}.seg .on{background:var(--g);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{padding:10px;border-radius:20px;animation:pop calc(.4s*var(--ts)) var(--sp);transition:transform .2s,opacity .2s}

.card .ac{display:flex;gap:4px;margin-top:6px}.card .ac button{flex:1;font-size:12px;padding:5px;border-radius:10px;background:var(--gb)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 6px;border-bottom:1px solid var(--gb)}
.field select,.field input[type=text],.in{background:var(--gb);border:0;border-radius:10px;padding:8px 10px;max-width:55%;min-width:0}
.in{width:100%;margin-bottom:10px;max-width:none}
.note{color:var(--s);font-size:13px;padding:10px 6px}
#reader{position:fixed;inset:0;z-index:10;overflow:auto;background:var(--rb,#fff);color:var(--rt,#222);padding:calc(var(--sa) + 14px) 18px 60px}

@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes up{from{transform:translateY(60%);opacity:0}}

[data-motion=off]{--tx:0!important;--ty:0!important}
</style>
</head>
<body>
<i id="orb"></i>

  <button data-act="fwd" id="bFwd" aria-label="Forward"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <button data-act="share" aria-label="Share"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M7 10H6a2 2 0 00-2 2v7a2 2 0 002 2h12a2 2 0 002-2v-7a2 2 0 00-2-2h-1"/></svg></button>

</nav>
<div id="menu" class="glass" hidden></div>
<div id="shade" hidden></div>

<div id="reader" hidden></div>
<div id="toast" role="status"></div>
<script>
(()=>{

const DEF={tabs:[],active:null,bm:[],hist:[],closed:[],read:[],set:{theme:"system",engine:"wiki",home:"",wall:"auto",motion:true,fav:true,freq:true,rl:true,rc:true,popups:false,tilt:true,glass:60,speed:1,bounce:1,depth:1,sound:true,vol:60}};
